name: "🏦 Controllo Notturno Stati Assegni - WinGaming"

on:
  repository_dispatch:
    types: [lancia_controllo_assegni]

permissions:
  contents: write
  actions: read

jobs:
  run-controllo-assegni:
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Clonazione repository
        uses: actions/checkout@v4

      - name: 🐍 Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Installazione dipendenze
        run: pip install requests openpyxl pandas

      - name: 🚀 Esecuzione Controllo Notturno
        env:
          TOKEN_ACCESSO_GITHUB: ${{ secrets.TOKEN_ACCESSO_GITHUB }}
        run: python robot_controllo_assegni.py
